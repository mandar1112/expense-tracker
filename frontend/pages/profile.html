<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Expense Tracker</title>

    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/profile.css">
</head>
<body>

<div class="app">

    <aside class="sidebar">
        <div class="sidebar-header">
            <a href="dashboard.html" class="sidebar-logo">Expense Tracker</a>
        </div>

        <nav class="sidebar-nav">
            <ul>
                <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
                <li><a href="expenses.html" class="nav-link">Expenses</a></li>
                <li><a href="reports.html" class="nav-link">Reports</a></li>
                <li><a href="profile.html" class="nav-link active">Profile</a></li>
                <li><a href="settings.html" class="nav-link">Settings</a></li>
            </ul>
        </nav>

        <div class="sidebar-footer">
            <a href="login.html" class="nav-link">Logout</a>
        </div>
    </aside>

    <div class="main-wrapper">

        <header class="header">
            <h1 class="header-title">Profile</h1>

            <div class="header-right">
                <a href="profile.html" class="user-button">
                    <span class="user-avatar">U</span>
                    <span>User</span>
                </a>
            </div>
        </header>

        <main class="content">

            <div class="page-header">
                <div>
                    <h1>Profile</h1>
                    <p>Manage your account information.</p>
                </div>
            </div>

            <section class="profile-card">

                <div class="profile-header">

                    <div class="profile-avatar">
                        U
                    </div>

                    <div class="profile-info">
                        <h2>User</h2>
                        <p data-user="email">Email will be loaded from the backend.</p>
                    </div>

                </div>

                <div class="profile-body">

                    <form class="profile-form" id="profile-form">

                        <div class="profile-form-row">

                            <div class="form-group">
                                <label for="profile-name">Full Name</label>
                                <input type="text" id="profile-name" name="name">
                            </div>

                            <div class="form-group">
                                <label for="profile-email">Email</label>
                                <input type="email" id="profile-email" name="email" readonly>
                            </div>

                        </div>

                        <div class="form-group">
                            <label for="profile-phone">Phone Number</label>
                            <input type="tel" id="profile-phone" name="phone">
                        </div>

                        <div>
                            <button type="submit" class="btn btn-primary">
                                Save Changes
                            </button>
                        </div>

                    </form>

                </div>

            </section>

        </main>

    </div>

</div>

</body>
</html>
