
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Reports - Expense Tracker</title>

        <link rel="stylesheet" href="../css/base.css">
        <link rel="stylesheet" href="../css/components.css">
        <link rel="stylesheet" href="../css/reports.css">
    </head>

    <body>

        <div class="app">

            <aside class="sidebar">
                <div class="sidebar-header">
                    <a href="dashboard.html" class="sidebar-logo">Expense Tracker</a>
                </div>

                <nav class="sidebar-nav">
                    <ul>
                        <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
                        <li><a href="expenses.html" class="nav-link">Expenses</a></li>
                        <li><a href="reports.html" class="nav-link active">Reports</a></li>
                        <li><a href="profile.html" class="nav-link">Profile</a></li>
                        <li><a href="settings.html" class="nav-link">Settings</a></li>
                    </ul>
                </nav>

                <div class="sidebar-footer">
                    <a href="#" class="nav-link" id="logout-button">Logout</a>
                </div>
            </aside>

            <div class="main-wrapper">

                <header class="header">
                    <button type="button" class="mobile-menu" aria-label="Open menu">☰</button>
                    <h1 class="header-title">Reports</h1>

                    <div class="header-right">
                        <a href="profile.html" class="user-button">
                            <span class="user-avatar">U</span>
                            <span>User</span>
                        </a>
                    </div>
                </header>

                <main class="content">

                    <div class="page-header">
                        <div>
                            <h1>Reports</h1>
                            <p>Analyze your spending patterns.</p>
                        </div>
                    </div>

                    <div class="report-filters">

                        <select id="report-period" class="filter-select">
                            <option value="">Select Period</option>
                            <option value="week">This Week</option>
                            <option value="month">This Month</option>
                            <option value="year">This Year</option>
                        </select>

                    </div>

                    <section class="report-grid">

                        <article class="report-card">

                            <div class="report-card-header">
                                <h2>Spending Overview</h2>
                            </div>

                            <div class="report-card-body">
                                <div class="chart-container" id="spending-chart">
                                    No report data available.
                                </div>
                            </div>

                        </article>

                        <article class="report-card">

                            <div class="report-card-header">
                                <h2>Summary</h2>
                            </div>

                            <div class="report-card-body">

                                <div class="report-stat">
                                    <div class="report-stat-label">Total Spending</div>
                                    <div class="report-stat-value" data-report="total">--</div>
                                </div>

                                <div class="report-stat">
                                    <div class="report-stat-label">Average Expense</div>
                                    <div class="report-stat-value" data-report="average">--</div>
                                </div>

                            </div>

                        </article>

                    </section>

                </main>

            </div>

        </div>

        <script src="../js/core/api.js"></script>
        <script src="../js/core/auth.js"></script>
        <script src="../js/core/utils.js"></script>

        <script src="../js/components/sidebar.js"></script>
        <script src="../js/components/modal.js"></script>
        <script src="../js/components/notifications.js"></script>

        <script src="../js/pages/reports.js"></script>

    </body>
</html>
