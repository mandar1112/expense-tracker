
<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Register - Expense Tracker</title>

        <link rel="stylesheet" href="../css/base.css">
        <link rel="stylesheet" href="../css/components.css">
        <link rel="stylesheet" href="../css/register.css">
    </head>

    <body>

        <main class="auth-page">
            <div class="auth-container">

                <div class="auth-logo">
                    <h1>Expense Tracker</h1>
                    <p>Create your secure account.</p>
                </div>

                <div class="auth-card">
                    <h2>Create Account</h2>
                    <p class="auth-description">Create an account to start managing your expenses.</p>

                    <form class="auth-form" id="register-form">

                        <div class="form-group">
                            <label for="name">Full Name</label>
                            <input type="text" id="name" name="name" autocomplete="name" required>
                        </div>

                        <div class="form-group">
                            <label for="email">Email Address</label>
                            <input type="email" id="email" name="email" autocomplete="email" required>
                        </div>

                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" id="password" name="password" autocomplete="new-password" required>
                        </div>

                        <div class="form-group">
                            <label for="confirm-password">Confirm Password</label>
                            <input type="password" id="confirm-password" name="confirm-password" autocomplete="new-password" required>
                        </div>

                        <div class="password-requirements">
                            Password requirements will be enforced by the backend.
                        </div>

                        <button type="submit" class="btn btn-primary">
                            Create Account
                        </button>

                    </form>

                    <div class="auth-footer">
                        <p>
                            Already have an account?
                            <a href="login.html">Login</a>
                        </p>
                    </div>
                </div>

            </div>
        </main>

        <script src = "../js/core/api.js"></script>
        <script src = "../js/core/auth.js"></script>
        <script src = "../js/core/utils.js"></script>
        <script src="../js/components/notifications.js"></script>
        <script src = "../js/pages/register.js"></script>

    </body>
</html>
